<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Controle de estoque" />
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="auth-screen" class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">CONTROLE DE ESTOQUE</p>
        <h1>Entre na sua conta</h1>
        <p class="muted">Use o e-mail cadastrado pelo administrador.</p>
        <form id="login-form" class="stack">
          <label>E-mail<input id="login-email" type="email" autocomplete="email" required /></label>
          <label>Senha<input id="login-password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Entrar</button>
        </form>
        <details>
          <summary>Primeiro acesso? Criar conta</summary>
          <form id="signup-form" class="stack spaced-top">
            <label>Nome<input id="signup-name" type="text" autocomplete="name" required /></label>
            <label>E-mail<input id="signup-email" type="email" autocomplete="email" required /></label>
            <label>Senha (ao menos 8 caracteres)<input id="signup-password" type="password" minlength="8" autocomplete="new-password" required /></label>
            <button type="submit" class="secondary">Solicitar acesso</button>
          </form>
          <p class="hint">Novas contas comecam como visualizadoras. Um administrador deve liberar o perfil.</p>
        </details>
        <p id="auth-message" class="message" aria-live="polite"></p>
      </section>
    </main>

    <div id="app" class="app hidden">
      <aside class="sidebar">
        <div><p class="eyebrow">ESTOQUE</p><h1>Controle</h1></div>
        <nav id="navigation" aria-label="Navegacao principal">
          <button data-page="dashboard" class="active">Visao geral</button>
          <button data-page="products">Produtos</button>
          <button data-page="movements">Movimentacoes</button>
          <button data-page="condiments">Condimentos</button>
          <button data-page="reports">Relatorios</button>
          <button data-page="users" data-admin-only>Usuarios</button>
        </nav>
        <div class="account"><strong id="user-name"></strong><span id="user-role" class="badge"></span><button id="logout" class="link-button">Sair</button></div>
      </aside>
      <main class="content">
        <div id="toast" class="toast" role="status"></div>
        <header class="page-header"><div><p id="page-kicker" class="eyebrow">PAINEL</p><h2 id="page-title">Visao geral</h2></div><button id="refresh" class="secondary">Atualizar</button></header>
        <section id="page-content"></section>
      </main>
    </div>

    <dialog id="modal"><form id="modal-form" method="dialog"><header><h3 id="modal-title"></h3><button type="button" id="modal-close" class="icon-button" aria-label="Fechar">&times;</button></header><div id="modal-body" class="stack"></div><footer><button type="button" id="modal-cancel" class="secondary">Cancelar</button><button id="modal-submit" value="default">Salvar</button></footer></form></dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
